---
- name: Enforce XFCE Theme Restrictions
  hosts: DCHNP47FWNS0002, DCHNPH5FECG0001, DCHNPH4FPAYBL02, DCHNPH5FPHD0001, DCHNPH5FPHD0002, DCHNPH5FOPC0001, DCHNPH5FECG0002, TCHNPH1FORE0003, TCHNPH1FIOR0002, TCHNPH2FPRE0003, TCHNPH2FLSR0002, TCHNPH2FRTI0001, TCHNPH2FINJ0292, TCHNPH2FRTC0001, TCHNPH2FRTD0007, TCHNPH2FRNS0005, TCHNPH2FRER003, TCHNPH5FPHYNS01, TCHNPH4FANS0001, TCHNPH2FRTR001, TCHNPH2FRTR0003
  become: yes
  gather_facts: no

  tasks:

    # =============================
    # 🔍 Detect XFCE Installed
    # =============================

    - name: Check XFCE installed
      shell: dpkg -l | grep -w xfce4-session
      register: xfce_check
      ignore_errors: yes
      changed_when: false

    - name: Show XFCE detection result
      debug:
        msg: "XFCE: {{ 'YES' if xfce_check.rc == 0 else 'NO' }}"

    # =============================
    # 🟡 XFCE RESTRICTIONS
    # =============================

    - name: Disable XFCE appearance settings
      when: xfce_check.rc == 0
      file:
        path: /usr/bin/xfce4-appearance-settings
        mode: '0644'

    - name: Disable XFCE window manager settings
      when: xfce_check.rc == 0
      file:
        path: /usr/bin/xfwm4-settings
        mode: '0644'
