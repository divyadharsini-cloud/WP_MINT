---
- name: Enforce XFCE Theme Restrictions
  hosts: DTVLIP1FU020030, TTVLIP1FU020022, TTVLIP1FU020025, TTVLIP1FU020023, TTVLIP1FU020026, TTVLIP1FU020032, TTVLIP1FU030038, TTVLIP1FU030040, TTVLIP1FU030039
  become: yes
  gather_facts: no

  tasks:

    # =============================
    # 🔍 Detect XFCE Installed
    # =============================

    - name: Check XFCE installed
      shell: dpkg -l | grep -w xfce4-session
      register: xfce_check
      ignore_errors: yes
      changed_when: false

    - name: Show XFCE detection result
      debug:
        msg: "XFCE: {{ 'YES' if xfce_check.rc == 0 else 'NO' }}"

    # =============================
    # 🟡 XFCE RESTRICTIONS
    # =============================

    - name: Disable XFCE appearance settings
      when: xfce_check.rc == 0
      file:
        path: /usr/bin/xfce4-appearance-settings
        mode: '0644'

    - name: Disable XFCE window manager settings
      when: xfce_check.rc == 0
      file:
        path: /usr/bin/xfwm4-settings
        mode: '0644'
