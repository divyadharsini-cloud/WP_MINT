---
- name: Set and Lock Wallpaper for All Users
  hosts: DPDYPHGFUN10017
  become: yes
  gather_facts: true

  vars:
    wallpaper_path: "/usr/share/mywallpapers/Test.jpg"

  tasks:

    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/mywallpapers
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy wallpaper
      copy:
        src: "Desktop_Wallpaper_Week_15.jpg"
        dest: "{{ wallpaper_path }}"
        owner: root
        group: root
        mode: '0644'

    - name: Create dconf directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/dconf/db/local.d
        - /etc/dconf/db/local.d/locks
        - /etc/dconf/profile

    # 🔹 GNOME
    - name: Set GNOME wallpaper
      copy:
        dest: "/etc/dconf/db/local.d/00-wallpaper-gnome"
        content: |
          [org/gnome/desktop/background]
          picture-uri='file://{{ wallpaper_path }}'
          picture-options='zoom'

    - name: Lock GNOME wallpaper
      copy:
        dest: "/etc/dconf/db/local.d/locks/gnome-background"
        content: |
          /org/gnome/desktop/background/picture-uri
          /org/gnome/desktop/background/picture-options

    # 🔹 Cinnamon (Linux Mint)
    - name: Set Cinnamon wallpaper
      copy:
        dest: "/etc/dconf/db/local.d/00-wallpaper-cinnamon"
        content: |
          [org/cinnamon/desktop/background]
          picture-uri='file://{{ wallpaper_path }}'
          picture-options='zoom'

    - name: Lock Cinnamon wallpaper
      copy:
        dest: "/etc/dconf/db/local.d/locks/cinnamon-background"
        content: |
          /org/cinnamon/desktop/background/picture-uri
          /org/cinnamon/desktop/background/picture-options

    - name: Ensure dconf profile exists
      copy:
        dest: /etc/dconf/profile/user
        content: |
          user-db:user
          system-db:local

    - name: Update dconf database
      command: dconf update

    # Optional (best effort)
    - name: Apply wallpaper to logged-in users (non-fatal)
      shell: |
        for uid in $(ls /run/user | grep -E '^[0-9]+$'); do
          user=$(id -nu $uid)
          DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
          sudo -u "$user" gsettings set org.gnome.desktop.background picture-uri "file://{{ wallpaper_path }}" || true

          DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
          sudo -u "$user" gsettings set org.cinnamon.desktop.background picture-uri "file://{{ wallpaper_path }}" || true
        done
      ignore_errors: yes
