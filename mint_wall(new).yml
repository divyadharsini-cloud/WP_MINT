- name: Set and Enforce Wallpaper Based on Desktop Environment
  hosts: Melur
  become: yes
  gather_facts: false

  vars:
    wallpaper_src: "pdy-wallpaper.jpg"
    wallpaper_path: "/usr/share/mywallpapers/Test.jpg"

  tasks:

    # =========================
    # 1. Copy Wallpaper
    # =========================
    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/mywallpapers
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy wallpaper to system
      copy:
        src: "{{ wallpaper_src }}"
        dest: "{{ wallpaper_path }}"
        owner: root
        group: root
        mode: '0644'

    # =========================
    # 2. Detect Desktop Environment
    # =========================
    - name: Check Cinnamon
      stat:
        path: /usr/bin/cinnamon
      register: cinnamon_check

    - name: Check XFCE
      stat:
        path: /usr/bin/xfce4-session
      register: xfce_check

    - name: Check GNOME
      stat:
        path: /usr/bin/gnome-shell
      register: gnome_check

    # =========================
    # 3. GNOME / Cinnamon (Apply + Lock)
    # =========================
    - name: Configure dconf for GNOME/Cinnamon
      when: cinnamon_check.stat.exists or gnome_check.stat.exists
      block:

        - name: Create dconf directories
          file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - /etc/dconf/db/local.d
            - /etc/dconf/db/local.d/locks
            - /etc/dconf/profile

        # 🔹 Cinnamon
        - name: Set Cinnamon wallpaper
          when: cinnamon_check.stat.exists
          copy:
            dest: /etc/dconf/db/local.d/00-cinnamon-wallpaper
            content: |
              [org/cinnamon/desktop/background]
              picture-uri='file://{{ wallpaper_path }}'
              picture-options='zoom'

        - name: Lock Cinnamon wallpaper
          when: cinnamon_check.stat.exists
          copy:
            dest: /etc/dconf/db/local.d/locks/cinnamon-wallpaper
            content: |
              /org/cinnamon/desktop/background/picture-uri
              /org/cinnamon/desktop/background/picture-options

        # 🔹 GNOME
        - name: Set GNOME wallpaper
          when: gnome_check.stat.exists
          copy:
            dest: /etc/dconf/db/local.d/00-gnome-wallpaper
            content: |
              [org/gnome/desktop/background]
              picture-uri='file://{{ wallpaper_path }}'
              picture-options='zoom'

        - name: Lock GNOME wallpaper
          when: gnome_check.stat.exists
          copy:
            dest: /etc/dconf/db/local.d/locks/gnome-wallpaper
            content: |
              /org/gnome/desktop/background/picture-uri
              /org/gnome/desktop/background/picture-options

        - name: Ensure dconf profile exists
          copy:
            dest: /etc/dconf/profile/user
            content: |
              user-db:user
              system-db:local

        - name: Update dconf database
          command: dconf update

    # =========================
    # 4. XFCE (Enforce at Login)
    # =========================
    - name: Configure XFCE wallpaper enforcement
      when: xfce_check.stat.exists
      block:

        - name: Ensure autostart directory exists
          file:
            path: /etc/xdg/autostart
            state: directory
            mode: '0755'

        - name: Create XFCE wallpaper enforcement script
          copy:
            dest: /usr/local/bin/set-xfce-wallpaper.sh
            mode: '0755'
            content: |
              #!/bin/bash

              WALL="{{ wallpaper_path }}"

              while true; do
                  xfconf-query -c xfce4-desktop -l | grep last-image | while read prop; do

                      CURRENT=$(xfconf-query -c xfce4-desktop -p "$prop" 2>/dev/null)

                      if [ "$CURRENT" != "$WALL" ]; then
                          xfconf-query -c xfce4-desktop -p "$prop" -s "$WALL"
                      fi

                  done

                  sleep 5
              done

        - name: Create autostart entry for XFCE
          copy:
            dest: /etc/xdg/autostart/set-xfce-wallpaper.desktop
            mode: '0644'
            content: |
              [Desktop Entry]
              Type=Application
              Name=XFCE Wallpaper Lock
              Exec=/usr/local/bin/set-xfce-wallpaper.sh
              OnlyShowIn=XFCE;
              X-GNOME-Autostart-enabled=true
