---
- name: Enforce Theme Restrictions (Cinnamon + XFCE - Full Lock)
  hosts: DMDUPH1FIOL0185
  become: yes
  gather_facts: yes

  vars:
    cinnamon_theme: "Mint-Y-Dark"
    cinnamon_icons: "Mint-Y"

  tasks:

  # =============================
  # Detect Desktop Environment
  # =============================

  - name: Check if Cinnamon is installed
    shell: dpkg -l | grep -i cinnamon
    register: cinnamon_check
    ignore_errors: yes
    changed_when: false

  - name: Check if XFCE is installed
    shell: dpkg -l | grep -i xfce4
    register: xfce_check
    ignore_errors: yes
    changed_when: false

  - name: Show detection result
    debug:
      msg: |
        Cinnamon: {{ 'YES' if cinnamon_check.rc == 0 else 'NO' }}
        XFCE: {{ 'YES' if xfce_check.rc == 0 else 'NO' }}

  # =============================
  # 🔧 Ensure dconf profile (IMPORTANT)
  # =============================

  - name: Ensure dconf profile exists
    when: cinnamon_check.rc == 0
    copy:
      dest: /etc/dconf/profile/user
      content: |
        user-db:user
        system-db:local
      mode: '0644'

  # =============================
  # 📁 Create dconf directories
  # =============================

  - name: Create dconf directory
    when: cinnamon_check.rc == 0
    file:
      path: /etc/dconf/db/local.d
      state: directory
      mode: '0755'

  - name: Create dconf lock directory
    when: cinnamon_check.rc == 0
    file:
      path: /etc/dconf/db/local.d/locks
      state: directory
      mode: '0755'

  # =============================
  # 🎯 Apply FULL Theme Enforcement
  # =============================

  - name: Set Cinnamon + GNOME enforced theme
    when: cinnamon_check.rc == 0
    copy:
      dest: /etc/dconf/db/local.d/00-theme
      content: |
        [org/cinnamon/desktop/interface]
        gtk-theme='{{ cinnamon_theme }}'
        icon-theme='{{ cinnamon_icons }}'

        [org/cinnamon/desktop/wm/preferences]
        theme='{{ cinnamon_theme }}'

        [org/gnome/desktop/interface]
        gtk-theme='{{ cinnamon_theme }}'
        icon-theme='{{ cinnamon_icons }}'
        cursor-theme='DMZ-White'
        color-scheme='prefer-dark'
        font-name='Ubuntu 10'
        document-font-name='Ubuntu 10'
        monospace-font-name='Ubuntu Mono 10'

        [org/cinnamon]
        enable-animations=false
        enabled-extensions=[]

  # =============================
  # 🔒 Lock ALL settings
  # =============================

  - name: Lock all theme settings
    when: cinnamon_check.rc == 0
    copy:
      dest: /etc/dconf/db/local.d/locks/theme-lock
      content: |
        /org/cinnamon/desktop/interface/gtk-theme
        /org/cinnamon/desktop/interface/icon-theme
        /org/cinnamon/desktop/wm/preferences/theme

        /org/gnome/desktop/interface/gtk-theme
        /org/gnome/desktop/interface/icon-theme
        /org/gnome/desktop/interface/cursor-theme
        /org/gnome/desktop/interface/color-scheme
        /org/gnome/desktop/interface/font-name
        /org/gnome/desktop/interface/document-font-name
        /org/gnome/desktop/interface/monospace-font-name

        /org/cinnamon/enable-animations
        /org/cinnamon/enabled-extensions

  # =============================
  # 🔄 Apply dconf changes
  # =============================

  - name: Update dconf
    when: cinnamon_check.rc == 0
    command: dconf update

  # =============================
  # 🟡 XFCE Restriction (Partial)
  # =============================

  - name: Disable XFCE appearance settings
    when: xfce_check.rc == 0
    file:
      path: /usr/bin/xfce4-appearance-settings
      mode: '0644'

  - name: Disable XFCE window manager settings
    when: xfce_check.rc == 0
    file:
      path: /usr/bin/xfwm4-settings
      mode: '0644'
