- name: Set XFCE Wallpaper for ALL Users (Enterprise Ready)
  hosts: DCHNP47FWNS0002, DCHNPH5FECG0001, DCHNPH4FPAYBL02, DCHNPH5FPHD0001, DCHNPH5FPHD0002, DCHNPH5FOPC0001, DCHNPH5FECG0002, TCHNPH1FORE0003, TCHNPH1FIOR0002, TCHNPH2FPRE0003, TCHNPH2FLSR0002, TCHNPH2FRTI0001, TCHNPH2FINJ0292, TCHNPH2FRTC0001, TCHNPH2FRTD0007, TCHNPH2FRNS0005, TCHNPH2FRER003, TCHNPH5FPHYNS01, TCHNPH4FANS0001, TCHNPH2FRTR001, TCHNPH2FRTR0003
  become: yes
  gather_facts: false

  vars:
    wallpaper_src: "Desktop_Wallpaper_Week_28_1.jpg"
    wallpaper_path: "/usr/share/mywallpapers/Test.jpg"

  tasks:

    # 1. Ensure wallpaper directory
    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/mywallpapers
        state: directory
        mode: '0755'

    # 2. Copy wallpaper
    - name: Copy wallpaper
      copy:
        src: "{{ wallpaper_src }}"
        dest: "{{ wallpaper_path }}"
        mode: '0644'

    # 3. Check XFCE installed
    - name: Check XFCE installed
      stat:
        path: /usr/bin/xfce4-session
      register: xfce_check

    # 4. Create wallpaper script (GLOBAL)
    - name: Create wallpaper script
      when: xfce_check.stat.exists
      copy:
        dest: /usr/local/bin/set-xfce-wallpaper.sh
        mode: '0755'
        content: |
          #!/bin/bash
          WALL="{{ wallpaper_path }}"

          # Wait for XFCE session to fully load
          sleep 10

          # Apply wallpaper
          xfconf-query -c xfce4-desktop -l | grep last-image | while read prop; do
              xfconf-query -c xfce4-desktop -p "$prop" -s "$WALL"
          done

          # Set style (zoom)
          xfconf-query -c xfce4-desktop -l | grep image-style | while read prop; do
              xfconf-query -c xfce4-desktop -p "$prop" -s 3
          done

    # ✅ 5. GLOBAL AUTOSTART (KEY CHANGE — NO USER LOOP)
    - name: Create global autostart entry
      when: xfce_check.stat.exists
      copy:
        dest: /etc/xdg/autostart/set-wallpaper.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=XFCE Wallpaper Setter
          Exec=/usr/local/bin/set-xfce-wallpaper.sh
          OnlyShowIn=XFCE;
          X-GNOME-Autostart-enabled=true
          Terminal=false
