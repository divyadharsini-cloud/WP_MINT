- name: Set XFCE Wallpaper for ALL Users (Enterprise Ready)
  hosts: DMDUPHGFMRD0005, DMDUPHGFU010063, DMDUPHGFU010069, DMDUPHGFU010075, DMDUPHGFU020090, DMDUPHGFU020091, DMDUPHGFU040092, DMDUPHUGU030129, DMDUPHUGATN0005, DMDUPHUGUI30009
  become: yes
  gather_facts: false

  vars:
    wallpaper_src: "pdy-wallpaper.jpg"
    wallpaper_path: "/usr/share/mywallpapers/Test.jpg"

  tasks:

    # =========================
    # 1. Ensure wallpaper directory
    # =========================
    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/mywallpapers
        state: directory
        mode: '0755'

    # =========================
    # 2. Copy wallpaper
    # =========================
    - name: Copy wallpaper
      copy:
        src: "{{ wallpaper_src }}"
        dest: "{{ wallpaper_path }}"
        mode: '0644'

    # =========================
    # 3. Check XFCE installed
    # =========================
    - name: Check XFCE installed
      stat:
        path: /usr/bin/xfce4-session
      register: xfce_check

    # =========================
    # 4. Get all users
    # =========================
    - name: Get users from /home
      when: xfce_check.stat.exists
      shell: "ls /home"
      register: users_list

    # =========================
    # 5. Create script (once)
    # =========================
    - name: Create wallpaper script
      when: xfce_check.stat.exists
      copy:
        dest: /usr/local/bin/set-xfce-wallpaper.sh
        mode: '0755'
        content: |
          #!/bin/bash

          WALL="{{ wallpaper_path }}"

          # Wait for XFCE session
          sleep 10

          xfconf-query -c xfce4-desktop -l | grep last-image | while read prop; do
              xfconf-query -c xfce4-desktop -p "$prop" -s "$WALL"
          done

          xfconf-query -c xfce4-desktop -l | grep image-style | while read prop; do
              xfconf-query -c xfce4-desktop -p "$prop" -s 3
          done

    # =========================
    # 6. Apply for ALL users
    # =========================
    - name: Setup autostart for all users
      when: xfce_check.stat.exists
      loop: "{{ users_list.stdout_lines }}"
      loop_control:
        loop_var: user

      block:

        - name: Ensure autostart dir exists
          file:
            path: "/home/{{ user }}/.config/autostart"
            state: directory
            owner: "{{ user }}"
            group: "{{ user }}"
            mode: '0755'

        - name: Create autostart file
          copy:
            dest: "/home/{{ user }}/.config/autostart/set-wallpaper.desktop"
            owner: "{{ user }}"
            group: "{{ user }}"
            mode: '0644'
            content: |
              [Desktop Entry]
              Type=Application
              Name=XFCE Wallpaper Setter
              Exec=/usr/local/bin/set-xfce-wallpaper.sh
              OnlyShowIn=XFCE;
              X-GNOME-Autostart-enabled=true
              Terminal=false
