- name: Set XFCE Wallpaper for ALL Users (Enterprise Ready)
  hosts: ansibletesting
  become: yes
  gather_facts: false

  vars:
    wallpaper_src: "pdy-wallpaper.jpg"
    wallpaper_path: "/usr/share/mywallpapers/Test.jpg"

  tasks:

    # 1. Ensure wallpaper directory
    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/mywallpapers
        state: directory
        mode: '0755'

    # 2. Copy wallpaper
    - name: Copy wallpaper
      copy:
        src: "{{ wallpaper_src }}"
        dest: "{{ wallpaper_path }}"
        mode: '0644'

    # 3. Check XFCE installed
    - name: Check XFCE installed
      stat:
        path: /usr/bin/xfce4-session
      register: xfce_check

    # 4. Get ALL users from /home (WORKS for LDAP + local)
    - name: Get all users from /home
      when: xfce_check.stat.exists
      shell: |
        ls /home | grep -v 'lost+found'
      register: users_list

    # 5. Create wallpaper script
    - name: Create wallpaper script
      when: xfce_check.stat.exists
      copy:
        dest: /usr/local/bin/set-xfce-wallpaper.sh
        mode: '0755'
        content: |
          #!/bin/bash
          WALL="{{ wallpaper_path }}"
          sleep 10

          xfconf-query -c xfce4-desktop -l | grep last-image | while read prop; do
              xfconf-query -c xfce4-desktop -p "$prop" -s "$WALL"
          done

          xfconf-query -c xfce4-desktop -l | grep image-style | while read prop; do
              xfconf-query -c xfce4-desktop -p "$prop" -s 3
          done

    # 6. Ensure autostart dir for each user
    - name: Ensure autostart dir exists
      when: xfce_check.stat.exists
      file:
        path: "/home/{{ item }}/.config/autostart"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0755'
      loop: "{{ users_list.stdout_lines }}"

    # 7. Create autostart file for each user
    - name: Create autostart file
      when: xfce_check.stat.exists
      copy:
        dest: "/home/{{ item }}/.config/autostart/set-wallpaper.desktop"
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=XFCE Wallpaper Setter
          Exec=/usr/local/bin/set-xfce-wallpaper.sh
          OnlyShowIn=XFCE;
          X-GNOME-Autostart-enabled=true
          Terminal=false
      loop: "{{ users_list.stdout_lines }}"

    # 8. Future users
    - name: Ensure skel autostart directory exists
      when: xfce_check.stat.exists
      file:
        path: /etc/skel/.config/autostart
        state: directory
        mode: '0755'

    - name: Add wallpaper autostart for future users
      when: xfce_check.stat.exists
      copy:
        dest: /etc/skel/.config/autostart/set-wallpaper.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=XFCE Wallpaper Setter
          Exec=/usr/local/bin/set-xfce-wallpaper.sh
          OnlyShowIn=XFCE;
          X-GNOME-Autostart-enabled=true
          Terminal=false
