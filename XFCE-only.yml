- name: Set Wallpaper ONLY for XFCE (Autostart - Reliable)
  hosts: ansibletesting
  become: yes
  gather_facts: false

  vars:
    wallpaper_src: "pdy-wallpaper.jpg"
    wallpaper_path: "/usr/share/mywallpapers/Test.jpg"

  tasks:

    # =========================
    # 1. Ensure directory
    # =========================
    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/mywallpapers
        state: directory
        owner: root
        group: root
        mode: '0755'

    # =========================
    # 2. Copy wallpaper
    # =========================
    - name: Copy wallpaper to system
      copy:
        src: "{{ wallpaper_src }}"
        dest: "{{ wallpaper_path }}"
        owner: root
        group: root
        mode: '0644'

    # =========================
    # 3. Check XFCE installed
    # =========================
    - name: Check XFCE installed
      stat:
        path: /usr/bin/xfce4-session
      register: xfce_check

    # =========================
    # 4. Configure XFCE (ONLY if exists)
    # =========================
    - name: Configure XFCE wallpaper via autostart
      when: xfce_check.stat.exists
      block:

        # -------------------------
        # Script (robust version)
        # -------------------------
        - name: Create XFCE wallpaper script
          copy:
            dest: /usr/local/bin/set-xfce-wallpaper.sh
            mode: '0755'
            content: |
              #!/bin/bash

              WALL="{{ wallpaper_path }}"

              # Wait until xfconf is available
              for i in {1..10}; do
                  xfconf-query -c xfce4-desktop -l >/dev/null 2>&1 && break
                  sleep 2
              done

              # Extra delay to ensure desktop loads
              sleep 5

              # Apply wallpaper for all monitors
              xfconf-query -c xfce4-desktop -l | grep last-image | while read prop; do
                  xfconf-query -c xfce4-desktop -p "$prop" -s "$WALL"
              done

              # Apply style (scaled)
              xfconf-query -c xfce4-desktop -l | grep image-style | while read prop; do
                  xfconf-query -c xfce4-desktop -p "$prop" -s 3
              done

        # -------------------------
        # Autostart entry
        # -------------------------
        - name: Ensure autostart directory exists
          file:
            path: /etc/xdg/autostart
            state: directory
            mode: '0755'

        - name: Create XFCE autostart entry
          copy:
            dest: /etc/xdg/autostart/xfce-wallpaper.desktop
            mode: '0644'
            content: |
              [Desktop Entry]
              Type=Application
              Name=XFCE Wallpaper Setter
              Exec=/usr/local/bin/set-xfce-wallpaper.sh
              OnlyShowIn=XFCE;
              X-GNOME-Autostart-enabled=true
              X-KDE-autostart-after=panel
