- name: Set XFCE Wallpaper (User-Level - Fully Reliable)
  hosts: DMDUPHGFMRD0005, DMDUPHGFU010063, DMDUPHGFU010069, DMDUPHGFU010075, DMDUPHGFU020090, DMDUPHGFU020091, DMDUPHGFU040092, DMDUPHUGU030129, DMDUPHUGATN0005, DMDUPHUGUI30009 
  become: yes
  gather_facts: false

  vars:
    wallpaper_src: "pdy-wallpaper.jpg"
    wallpaper_path: "/usr/share/mywallpapers/Test.jpg"
    target_user: "adminit"

  tasks:

    # =========================
    # 1. Ensure wallpaper directory
    # =========================
    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/mywallpapers
        state: directory
        owner: root
        group: root
        mode: '0755'

    # =========================
    # 2. Copy wallpaper
    # =========================
    - name: Copy wallpaper to system
      copy:
        src: "{{ wallpaper_src }}"
        dest: "{{ wallpaper_path }}"
        owner: root
        group: root
        mode: '0644'

    # =========================
    # 3. Check XFCE installed
    # =========================
    - name: Check XFCE installed
      stat:
        path: /usr/bin/xfce4-session
      register: xfce_check

    # =========================
    # 4. Apply ONLY if XFCE exists
    # =========================
    - name: Configure XFCE wallpaper (user-level autostart)
      when: xfce_check.stat.exists
      block:

        # -------------------------
        # Script (runs inside user session)
        # -------------------------
        - name: Create wallpaper script
          copy:
            dest: /usr/local/bin/set-xfce-wallpaper.sh
            mode: '0755'
            content: |
              #!/bin/bash

              WALL="{{ wallpaper_path }}"

              # Wait for XFCE session fully ready
              sleep 10

              # Apply wallpaper to all monitors
              xfconf-query -c xfce4-desktop -l | grep last-image | while read prop; do
                  xfconf-query -c xfce4-desktop -p "$prop" -s "$WALL"
              done

              # Set style (zoom)
              xfconf-query -c xfce4-desktop -l | grep image-style | while read prop; do
                  xfconf-query -c xfce4-desktop -p "$prop" -s 3
              done

        # -------------------------
        # Create USER autostart (IMPORTANT)
        # -------------------------
        - name: Ensure user autostart directory exists
          file:
            path: "/home/{{ target_user }}/.config/autostart"
            state: directory
            owner: "{{ target_user }}"
            group: "{{ target_user }}"
            mode: '0755'

        - name: Create user autostart entry
          copy:
            dest: "/home/{{ target_user }}/.config/autostart/set-wallpaper.desktop"
            owner: "{{ target_user }}"
            group: "{{ target_user }}"
            mode: '0644'
            content: |
              [Desktop Entry]
              Type=Application
              Name=XFCE Wallpaper Setter
              Exec=/usr/local/bin/set-xfce-wallpaper.sh
              OnlyShowIn=XFCE;
              X-GNOME-Autostart-enabled=true
              Terminal=false
